[project]
name = "finalproject-shchigol-m26-555"
version = "0.1.0"
description = "Консольная платформа для виртуальной торговли валютами и отслеживания курсов"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
